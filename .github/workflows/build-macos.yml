name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Build EcoDICOM.app
        run: |
          chmod +x build_macos.sh
          pyinstaller --noconfirm --clean EcoDICOM-macos.spec
          ditto -c -k --sequesterRsrc --keepParent dist/EcoDICOM.app dist/EcoDICOM-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoDICOM-macOS
          path: dist/EcoDICOM-macOS.zip
          if-no-files-found: error

      # Lo más simple: cada tag v* publica el zip en GitHub Releases
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EcoDICOM-macOS.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
